<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - AI Travel Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        nav {
            background: #2563eb;
            color: white;
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-size: 14px;
        }

        .header {
            text-align: center;
            padding: 35px 20px 20px;
        }

        .header h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .container {
            width: 92%;
            max-width: 800px;
            margin: 20px auto 50px;
        }

        .booking-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .hotel-box {
            background: #eff6ff;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .hotel-box h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .price {
            color: #16a34a;
            font-weight: bold;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .book-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .book-button:hover {
            background: #1d4ed8;
        }

        .success {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            line-height: 1.7;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 12px 20px;
            background: #475569;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            nav a {
                margin-left: 7px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">✈️ AI Travel Planner</div>

    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="planner.html">Plan Trip</a>
        <a href="itinerary.html">Itinerary</a>
        <a href="hotels.html">Hotels</a>
        <a href="booking.html">Booking</a>
    </div>
</nav>


<div class="header">
    <h1>📝 Hotel Booking</h1>
    <p>Complete your booking details</p>
</div>


<div class="container">

    <div class="booking-card">

        <div class="hotel-box">

            <h2 id="hotelName">🏨 Selected Hotel</h2>

            <p>
                📍 Destination:
                <span id="destination">Your Destination</span>
            </p>

            <br>

            <p class="price">
                ₹<span id="hotelPrice">0</span> / night
            </p>

        </div>


        <form id="bookingForm">

            <div class="form-group">
                <label>👤 Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-group">
                <label>📧 Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label>📱 Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    required
                >
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label>📅 Check-in</label>

                    <input
                        type="date"
                        id="checkin"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>📅 Check-out</label>

                    <input
                        type="date"
                        id="checkout"
                        required
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label>👥 Guests</label>

                    <select id="guests">

                        <option value="1">1 Guest</option>
                        <option value="2" selected>2 Guests</option>
                        <option value="3">3 Guests</option>
                        <option value="4">4 Guests</option>
                        <option value="5">5 Guests</option>
                        <option value="6">6 Guests</option>

                    </select>
                </div>


                <div class="form-group">
                    <label>🛏️ Rooms</label>

                    <select id="rooms">

                        <option value="1" selected>1 Room</option>
                        <option value="2">2 Rooms</option>
                        <option value="3">3 Rooms</option>
                        <option value="4">4 Rooms</option>

                    </select>
                </div>

            </div>


            <button
                type="submit"
                class="book-button">
                ✅ Confirm Booking
            </button>

        </form>


        <div id="successMessage" class="success"></div>

    </div>


    <a href="hotels.html" class="back-btn">
        ← Back to Hotels
    </a>

</div>


<footer>
    <p>AI Travel Planner © 2026</p>
    <p>Developed as an Academic Project</p>
</footer>


<script>

const selectedHotel =
    localStorage.getItem("selectedHotel");

const tripData =
    localStorage.getItem("aiTravelTrip");


if (selectedHotel) {

    const hotel = JSON.parse(selectedHotel);

    document.getElementById("hotelName").innerText =
        "🏨 " + hotel.name;

    document.getElementById("hotelPrice").innerText =
        hotel.price;
}


if (tripData) {

    const trip = JSON.parse(tripData);

    document.getElementById("destination").innerText =
        trip.destination || "Your Destination";
}


document.getElementById("bookingForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const fullName =
        document.getElementById("fullName").value;

    const email =
        document.getElementById("email").value;

    const mobile =
        document.getElementById("mobile").value;

    const checkin =
        document.getElementById("checkin").value;

    const checkout =
        document.getElementById("checkout").value;

    const guests =
        document.getElementById("guests").value;

    const rooms =
        document.getElementById("rooms").value;


    if (new Date(checkout) <= new Date(checkin)) {

        alert("⚠️ Check-out date must be after check-in date.");

        return;
    }


    const booking = {

        hotel:
            selectedHotel
            ? JSON.parse(selectedHotel).name
            : "Selected Hotel",

        destination:
            tripData
            ? JSON.parse(tripData).destination
            : "Your Destination",

        fullName: fullName,
        email: email,
        mobile: mobile,
        checkin: checkin,
        checkout: checkout,
        guests: guests,
        rooms: rooms,

        bookingId:
            "AIP" + Date.now()

    };


    localStorage.setItem(
        "travelBooking",
        JSON.stringify(booking)
    );


    document.getElementById("successMessage").style.display =
        "block";


    document.getElementById("successMessage").innerHTML = `

        <h3>🎉 Booking Confirmed!</h3>

        <p>
            <strong>Booking ID:</strong>
            ${booking.bookingId}
        </p>

        <p>
            <strong>Hotel:</strong>
            ${booking.hotel}
        </p>

        <p>
            <strong>Destination:</strong>
            ${booking.destination}
        </p>

        <p>
            <strong>Check-in:</strong>
            ${booking.checkin}
        </p>

        <p>
            <strong>Check-out:</strong>
            ${booking.checkout}
        </p>

        <p>
            <strong>Guests:</strong>
            ${booking.guests}
        </p>

        <p>
            <strong>Rooms:</strong>
            ${booking.rooms}
        </p>

        <br>

        <button
            class="book-button"
            onclick="window.location.href='ticket.html'">
            🎟️ View Digital Ticket
        </button>

    `;

});

</script>

</body>
</html>
